<!DOCTYPE html>
<html>
<head>
    <title>Register - MedPredict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 420px;">
        <h3 class="text-center mb-3">Create Account</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 mt-2">Register</button>
        </form>
        <p class="text-center mt-3 mb-0 small">Already registered? <a href="{% url 'login' %}">Login</a></p>
    </div>
</body>
</html>
