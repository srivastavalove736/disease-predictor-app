<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedPredict Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    
    <!-- ApexCharts JS -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="py-4">

<div class="container-fluid px-4" style="max-width: 1400px;">
    
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Health Analytics & Screening</h3>
            <p class="text-muted small mb-0">Overview of active patient diagnostics and AI predictive models</p>
        </div>
        <button class="dash-btn-primary"><i class="bi bi-plus-lg me-2"></i>New Screening</button>
    </div>

    <!-- Top Metric Cards (KPIs) -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="dash-card">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="metric-title">Total Tests</span>
                    <i class="bi bi-activity text-primary fs-5"></i>
                </div>
                <div class="metric-value">1,482</div>
                <span class="metric-badge badge-up"><i class="bi bi-arrow-up-short"></i>+12.4% vs last mo</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dash-card">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="metric-title">Diabetes Risk</span>
                    <i class="bi bi-heart-pulse text-danger fs-5"></i>
                </div>
                <div class="metric-value">24%</div>
                <span class="metric-badge badge-blue">Low Risk Avg</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dash-card">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="metric-title">AI Accuracy</span>
                    <i class="bi bi-cpu text-info fs-5"></i>
                </div>
                <div class="metric-value">98.2%</div>
                <span class="metric-badge badge-up">v2.4 Model</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dash-card">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="metric-title">Reports Generated</span>
                    <i class="bi bi-file-earmark-check text-success fs-5"></i>
                </div>
                <div class="metric-value">890</div>
                <span class="metric-badge badge-up"><i class="bi bi-arrow-up-short"></i>+8.1%</span>
            </div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="row g-3">
        <!-- Main Line Chart -->
        <div class="col-lg-8">
            <div class="dash-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0">Monthly Screening Volume</h6>
                    <span class="text-muted small">2026 Trend</span>
                </div>
                <div id="chart-timeline"></div>
            </div>
        </div>

        <!-- Donut Risk Chart -->
        <div class="col-lg-4">
            <div class="dash-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0">Screening Categories Breakdown</h6>
                </div>
                <div id="chart-donut"></div>
            </div>
        </div>
    </div>

</div>

<script>
    // 1. Line Chart Configuration (Gradient area style)
    const lineOptions = {
        series: [{ name: 'Screenings Completed', data: [31, 40, 28, 51, 42, 109, 100, 120] }],
        chart: { height: 320, type: 'area', toolbar: { show: false }, background: 'transparent' },
        theme: { mode: 'dark' },
        colors: ['#3b82f6'],
        stroke: { curve: 'smooth', width: 3 },
        fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.45, opacityTo: 0.05 } },
        dataLabels: { enabled: false },
        xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'] }
    };
    new ApexCharts(document.querySelector("#chart-timeline"), lineOptions).render();

    // 2. Donut Chart Configuration
    const donutOptions = {
        series: [44, 25, 19, 12],
        labels: ['Diabetes', 'Heart', 'Parkinsons', 'Skin/Tumor'],
        chart: { type: 'donut', height: 320, background: 'transparent' },
        theme: { mode: 'dark' },
        colors: ['#3b82f6', '#ec4899', '#10b981', '#06b6d4'],
        legend: { position: 'bottom' },
        stroke: { show: false }
    };
    new ApexCharts(document.querySelector("#chart-donut"), donutOptions).render();
</script>

</body>
</html>
